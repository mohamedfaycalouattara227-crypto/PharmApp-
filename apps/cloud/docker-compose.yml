# ─── PharmApp Cloud — docker-compose (développement & démo) ──────────────────
# Usage : docker compose up -d
# Pré-requis : fichier .env à la racine (copié depuis .env.example)

services:

  db:
    image: postgres:16-alpine
    container_name: pharmapp_cloud_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pharmapp_cloud
      POSTGRES_USER:     pharmapp_cloud
      POSTGRES_PASSWORD: pharmapp_cloud_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapp_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pharmapp_cloud_web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pharmapp_cloud:pharmapp_cloud_dev@db:5432/pharmapp_cloud
      DJANGO_ENV: production
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        gunicorn pharmapp_cloud.wsgi
          --bind 0.0.0.0:8001
          --workers 4
          --timeout 30
          --access-logfile -
          --error-logfile -
          --log-level info
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/cloud/healthz/')\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  db_data:
