services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmapp
      POSTGRES_USER: pharmapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pharmapp:${POSTGRES_PASSWORD:-pharmapp}@db:5432/pharmapp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
      - logs:/app/logs

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pharmapp:${POSTGRES_PASSWORD:-pharmapp}@db:5432/pharmapp
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "pharmapp", "worker", "-l", "info", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs:/app/logs

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pharmapp:${POSTGRES_PASSWORD:-pharmapp}@db:5432/pharmapp
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "pharmapp", "beat", "-l", "info"]
    depends_on:
      - redis
    volumes:
      - logs:/app/logs

volumes:
  pgdata:
  redisdata:
  media:
  logs:
