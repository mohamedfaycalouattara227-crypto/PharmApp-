[tool:pytest]
# Voir pytest.ini pour la configuration principale

[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */conftest.py
    pharmapp/parametres/*
    manage.py
    */wsgi.py
    */asgi.py
    */admin.py
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise NotImplementedError
    if TYPE_CHECKING:
    @overload
    pass
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = rapports/couverture
title = PharmApp — Rapport de couverture

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    migrations,
    .venv
